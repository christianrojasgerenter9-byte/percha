<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percha - Recomendación de Estilo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>PERCHA</h1>
            <div class="menu-icon"></div>
        </header>

        <main>
            <h2 class="section-title">Tu Estilo de Hoy</h2>
            
            <div class="hero-card">
                <div class="hero-image">
                    [ Imagen de Conjunto ]
                </div>
                <div class="hero-content">
                    <h2>Elegancia Nocturna</h2>
                    <p>Ideal para eventos formales en la ciudad.</p>
                    <a href="#" class="btn">Ver Detalles</a>
                </div>
            </div>

            <h2 class="section-title">Piezas Clave</h2>
            <div class="items-grid">
                <div class="item-card">
                    <div class="item-image-placeholder"></div>
                    <h3>Blazer Sastre</h3>
                    <p>$ 2,400</p>
                </div>
                <div class="item-card">
                    <div class="item-image-placeholder"></div>
                    <h3>Camisa Seda</h3>
                    <p>$ 1,150</p>
                </div>
                <div class="item-card">
                    <div class="item-image-placeholder"></div>
                    <h3>Pantalón Slim</h3>
                    <p>$ 1,300</p>
                </div>
                <div class="item-card">
                    <div class="item-image-placeholder"></div>
                    <h3>Botines Piel</h3>
                    <p>$ 3,200</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
